<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css" />
    <script
      src="https://kit.fontawesome.com/9762725b37.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="background" onclick="hide()"></div>
    <div id="header">
      <h1>Study With Me!</h1>
      <h3 id="current_page">Dashboard</h3>
    </div>

    <main>
      <div class="dashboard">
        <div id="topbar">
          <button class="icons">
            <i
              class="fa-solid fa-filter fa-lg"
              style="color: hsl(0, 12%, 38%)"
            ></i>
          </button>

          <input type="text" id="searchBar"></input>

          <button class="icons" onclick="createCard()">
            <i class="fa-solid fa-plus fa-lg" style="color: #0e2d63"></i>
          </button>

          <button class="icons">
            <i
              class="fa-solid fa-pencil fa-lg"
              style="color: rgb(88, 101, 51)"
            ></i>
          </button>
          <button class="icons" onclick="deleteCard()">
            <i
              class="fa-solid fa-trash-can fa-lg"
              style="color: rgb(165, 58, 58)"
            ></i>
          </button>
          <button class="icons" onclick="select()">
            <i
              class="fa-regular fa-square fa-lg"
              style="color: rgb(109, 85, 85)"
            ></i>
          </button>
        </div>
        <div id="dashboard_main">
          <div class="cells" id="new_cell">
            <div class="cell_header"></div>
            <div class="cell_body">
              <form action="/createNew" method="post">
                <textarea name="subject_title" id="title" placeholder="Enter the Subject Title" required></textarea>
                <textarea name="subject_description" id="desc" placeholder="Enter the Subject Description" required></textarea>
                <input type="submit">
              </form>
            </div>
          </div>
        </div>
      </div>
      <div id="sidebar">
        <h3>Latest Tasks</h3>
        <ul>
          <li>Contemporary Philippine Arts from the Regios</li>
          <li>Contemporary Philippine Arts from the Regios</li>
        </ul>
      </div>
    </main>

    <script src="/src/home.js"></script>
  </body>
</html>
