<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta
               name="viewport"
               content="width=device-width, initial-scale=1.0"
          />
          <title>Document</title>
          <link rel="stylesheet" href="/styles.css" />
          <script
               src="https://kit.fontawesome.com/9762725b37.js"
               crossorigin="anonymous"
          ></script>
     </head>
     <body>
          <div id="background" onclick="hide()"></div>
          <div id="header">
               <h1>Study With Me!</h1>
               <h3 id="current_page">Dashboard</h3>
          </div>

          <main id="subj_overview">
               <div class="dashboard subj">
                    <div id="content">
                         <h1 id="subject_title"></h1>
                         <ul id="studyList" contenteditable="true"></ul>
                         <h3>Note to self</h3>
                         <p id="noteSelf" contenteditable="true"></p>

                         <a href="">Link to Flashcards</a>
                         <a href="">Link to Document</a>
                    </div>
               </div>
               <div id="clock">
                    <div id="clock_module"></div>
                    <div id="control">
                         <div id="timeBox">
                              <h2 contenteditable="true" id="hour">00</h2>
                              <h2>:</h2>
                              <h2 contenteditable="true" id="minute">00</h2>
                              <h2>:</h2>
                              <h2 contenteditable="true" id="second">00</h2>
                         </div>
                         <div id="control_panel">
                              <button id="button_start" onclick="start()">
                                   START
                              </button>
                              <button id="button_stop" onclick="stop()">
                                   STOP
                              </button>
                              <button id="button_restart" onclick="restart()">
                                   RESTART
                              </button>
                         </div>
                         <audio
                              src="/alarm_tone.mp3"
                              type="audio/mpeg"
                              id="alarm_tone"
                         ></audio>
                    </div>
               </div>
          </main>

          <script src="/src/subj_overview.js"></script>
     </body>
</html>
